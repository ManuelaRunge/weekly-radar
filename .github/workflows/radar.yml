name: RIDA Radar (private review)
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 1'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python src/collect.py
      - run: python src/brief.py
      - run: python src/newsletter_ai.py --mode prepare
      - name: Commit private briefing and data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data output
          git diff --cached --quiet || (git commit -m 'Update private radar briefing' && git push)
